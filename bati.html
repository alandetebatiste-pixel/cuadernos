<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agenda Tech · Bati</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Centro de mando: panel lateral (progreso, categorías) + zona principal (comandos, línea de 14 días, pestañas Tareas/Ideas/Hechas). */
:root{
  --bg:#0a0f1f; --panel:#10172c; --panel2:#151e38; --line:#212c4d; --fg:#e8ecff; --muted:#8792b8;
  --violet:#8b7bff; --violet-dk:#5a4bd6; --amber:#ffb547; --cyan:#4fd6e8; --red:#ff6b7a; --green:#5fe0a1;
  --sans:"Sora",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,123,255,.16),transparent 60%),radial-gradient(700px 400px at -10% 110%,rgba(79,214,232,.08),transparent 60%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.shell{max-width:1180px;margin:0 auto;padding:24px 16px 64px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}

/* Panel lateral */
aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){aside{position:static}}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:12px;background:conic-gradient(from 200deg,var(--violet),var(--cyan),var(--amber),var(--violet));display:grid;place-content:center;font:800 1.1rem var(--sans);color:var(--bg)}
.who h1{font:700 1.15rem/1.2 var(--sans);margin:0}
.who p{margin:0;color:var(--muted);font-size:.82rem}
.ringwrap{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.ring .v{font:700 20px var(--sans);fill:var(--fg)} .ring .l{font:400 9px var(--mono);fill:var(--muted)}
.kpis{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
.kpis b{font:600 1rem var(--mono);color:var(--fg);margin-right:6px;font-variant-numeric:tabular-nums}
.kpis .r b{color:var(--red)} .kpis .a b{color:var(--amber)} .kpis .c b{color:var(--cyan)}
.cardh{font:600 .8rem var(--sans);color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between}
.cats{display:flex;flex-direction:column;gap:2px}
.catrow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;text-align:left;font-size:.88rem}
.catrow:hover{background:rgba(255,255,255,.04)}
.catrow[aria-pressed="true"]{background:rgba(139,123,255,.16)}
.catrow i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.catrow span:last-child{font:400 .8rem var(--mono);color:var(--muted)}
.catrow .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.catrow .bar em{display:block;height:100%;background:var(--c)}

/* Principal */
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.cmd{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.cmd:focus-within{border-color:var(--violet)}
.cmdin{display:flex;gap:10px;align-items:flex-start;padding:10px 12px 0}
.prompt{font:600 1.1rem/1.6 var(--mono);color:var(--violet)}
.cmd textarea{flex:1;min-width:0;background:transparent;border:none;color:var(--fg);font:400 1rem/1.6 var(--sans);resize:none;padding:0;min-height:52px}
.cmd textarea:focus{outline:none}
.cmd textarea::placeholder{color:var(--muted)}
.cmdbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border-top:1px solid var(--line)}
.cmdbar select,.cmdbar input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font:400 .82rem var(--sans);border-radius:8px;padding:7px 9px;min-height:34px;max-width:100%}
.q{font:400 .78rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
.q[aria-pressed="true"]{color:var(--fg);border-color:var(--violet);background:rgba(139,123,255,.14)}
.go{margin-left:auto;background:var(--violet);color:#fff;font-weight:700;border-radius:10px;padding:8px 16px;min-height:36px;display:flex;gap:8px;align-items:center}
.go kbd{font:400 .7rem var(--mono);opacity:.75;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 4px}
.go:disabled{opacity:.5}
.status{margin:0;padding:0 10px 6px;font-size:.82rem;color:var(--muted);min-height:1.3em}

/* Línea de 14 días */
.timeline{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:118px}
.tl{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;border-radius:8px;padding:4px 0}
.tl:hover{background:rgba(255,255,255,.03)}
.tl[aria-pressed="true"]{background:rgba(139,123,255,.14)}
.stack{display:flex;flex-direction:column-reverse;gap:2px;width:min(22px,70%)}
.stack i{height:14px;border-radius:3px;background:var(--c)}
.tl .cnt{font:600 .7rem var(--mono);color:var(--fg)}
.tl .dn{font:600 .72rem var(--mono);color:var(--muted)}
.tl.today .dn{color:var(--bg);background:var(--amber);border-radius:4px;padding:0 4px}
.tl.wknd .dn{opacity:.55}
.tlh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.tlh h2{font:600 .95rem var(--sans);margin:0}
.tlh span{font:400 .78rem var(--mono);color:var(--muted)}
.clear{font:400 .78rem var(--mono);color:var(--violet)}

/* Pestañas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab span{font:400 .75rem var(--mono);background:var(--panel2);border-radius:6px;padding:0 6px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--violet)}

/* Tareas */
.group h3{font:600 .82rem var(--sans);color:var(--muted);margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.group h3 b{font:400 .75rem var(--mono)}
.group.late h3{color:var(--red)} .group.today h3{color:var(--amber)}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.rows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);position:relative}
.rows li:first-child{border-top:none}
.rows li::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.rows li:hover{background:rgba(255,255,255,.02)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-content:center}
.chk[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.chk[aria-checked="true"]::after{content:"";width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.ttl{min-width:0;overflow-wrap:anywhere;font-weight:600}
li.done .ttl{color:var(--muted);text-decoration:line-through}
.meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:400 .76rem var(--mono);color:var(--muted)}
.meta select,.meta input{background:transparent;border:1px solid transparent;color:var(--muted);font:inherit;border-radius:6px;padding:2px 4px}
.meta select:hover,.meta input:hover{border-color:var(--line)}
.pill{padding:1px 8px;border-radius:99px;font-weight:600}
.pill.r{background:rgba(255,107,122,.14);color:var(--red)} .pill.a{background:rgba(255,181,71,.14);color:var(--amber)} .pill.c{background:rgba(79,214,232,.12);color:var(--cyan)}
.lnk{color:var(--cyan);text-decoration:none}
.lnk:hover{text-decoration:underline}
.x{color:var(--muted);font:400 .76rem var(--mono);padding:4px 6px;border-radius:6px}
.x:hover{background:rgba(255,255,255,.05)}
.x.confirm{color:var(--red)}

/* Ideas */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.idea{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;max-width:100%;background:var(--panel2) center/cover no-repeat;display:flex;align-items:flex-end;padding:8px;position:relative;text-decoration:none}
.thumb.ig{background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af 80%,#515bd4)}
.thumb.txt{background:linear-gradient(135deg,var(--panel2),#1b2547)}
.thumb .src{font:600 .7rem var(--mono);background:rgba(10,15,31,.75);color:#fff;border-radius:6px;padding:2px 7px}
.thumb.txt .big{position:absolute;inset:0;display:grid;place-content:center;font:800 2.6rem var(--sans);color:rgba(255,255,255,.07)}
.ib{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.ib .ttl{font-size:.92rem}
.ib .sum{font-size:.8rem;color:var(--muted)}
.ia{display:flex;gap:6px;align-items:center;margin-top:auto;flex-wrap:wrap}
.promote{font:600 .76rem var(--sans);color:var(--violet);border:1px solid var(--violet-dk);border-radius:8px;padding:5px 9px}
.promote:hover{background:rgba(139,123,255,.14)}
.tagc{font:400 .72rem var(--mono);color:var(--c)}

.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted);margin-top:16px}
.empty b{display:block;color:var(--fg);font-size:1rem;margin-bottom:4px}

/* Marca */
.brand{display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(79,214,232,.18),transparent 70%)}
.logo{width:58px;height:58px;flex:none;filter:drop-shadow(0 0 12px rgba(139,123,255,.45))}
.wordmark{min-width:0}
.eyebrow{margin:0;font:600 .72rem var(--mono);color:var(--cyan);display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.led{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.brand h1{font:800 1.9rem/1 var(--sans);margin:2px 0 4px;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,#c9c2ff 60%,#8fe9f4);-webkit-background-clip:text;background-clip:text;color:transparent}
.cursor{color:var(--violet);-webkit-text-fill-color:var(--violet);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dateline{margin:0;color:var(--muted);font-size:.8rem}
/* Títulos que abren el editor */
.ttl.open{text-align:left;padding:0;cursor:pointer;border-radius:4px}
.ttl.open:hover{color:var(--violet)}
/* Panel de edición lateral */
dialog.ed{border:none;padding:0;margin:0 0 0 auto;height:100%;max-height:100%;width:min(440px,100%);background:var(--panel);color:var(--fg);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
dialog.ed::backdrop{background:rgba(5,8,18,.6);backdrop-filter:blur(4px)}
dialog.ed[open]{animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.ed-form{padding:22px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.ed-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ed-title{font:700 1.05rem var(--sans);margin:0}
.ed-title::before{content:"› ";color:var(--violet);font-family:var(--mono)}
.ed-close{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.ed-field{display:flex;flex-direction:column;gap:6px}
.ed-lbl{font:600 .72rem var(--mono);color:var(--muted)}
.ed-input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font:400 .95rem var(--sans);border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
.ed-input:focus{border-color:var(--violet);outline:none}
.ed-datewrap{display:flex;flex-direction:column;gap:6px}
.ed-quick{display:flex;flex-wrap:wrap;gap:6px}
.ed-chip{font:400 .76rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.ed-chip:hover{color:var(--fg);border-color:var(--violet)}
.ed-seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content}
.ed-segbtn{padding:6px 18px;border-radius:7px;font-weight:600;color:var(--muted)}
.ed-segbtn[aria-checked="true"]{background:var(--violet);color:#fff}
.ed-link{color:var(--cyan);font:400 .85rem var(--mono);text-decoration:none}
.ed-note{margin:0;font:400 .8rem var(--mono);color:var(--amber)}
.ed-actions{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.ed-del{color:var(--red);font:400 .8rem var(--mono);padding:0 8px}
.ed-del.confirm{background:rgba(255,107,122,.14);border-radius:10px}
.ed-done{border:1px solid var(--green);color:var(--green);border-radius:10px;padding:10px;font-weight:600}
.ed-save{background:var(--violet);color:#fff;border-radius:10px;padding:10px;font-weight:700}

.cedit{font:400 .74rem var(--mono);color:var(--violet);padding:0 4px;border-radius:4px}
.cedit:hover{text-decoration:underline}
.ed-help{margin:0;color:var(--muted);font-size:.85rem}
.cm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cm-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--panel2)}
.cm-row .ed-input{background:transparent;border-color:transparent;padding:6px 8px}
.cm-row .ed-input:focus{border-color:var(--violet)}
.cm-dot{width:10px;height:10px;border-radius:3px}
.cm-count{font:400 .72rem var(--mono);color:var(--muted);white-space:nowrap}
.cm-save{background:var(--violet);color:#fff;border-radius:8px;padding:5px 10px;font-size:.78rem;font-weight:700}
.cm-del{font:400 .74rem var(--mono);color:var(--red);padding:5px}
.cm-confirm{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
.cm-btns{display:flex;gap:8px;justify-content:flex-end}
.cm-ok{background:var(--red);color:#0a0f1f;border-radius:8px;padding:7px 12px;font-weight:700}
.cm-no{color:var(--muted);padding:7px 10px}
.cm-add{display:grid;grid-template-columns:1fr auto;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="card brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset=".55" stop-color="#4fd6e8"/><stop offset="1" stop-color="#5fe0a1"/></linearGradient></defs>
        <path d="M32 3 57 17.5v29L32 61 7 46.5v-29z" fill="#0a0f1f" stroke="url(#lg)" stroke-width="2.5"/>
        <path d="M24 18h10.5a7 7 0 0 1 0 14H24zM24 32h12a7.5 7.5 0 0 1 0 15H24z" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linejoin="round"/>
        <path d="M24 18v29" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"/>
        <path d="M7 32h9M48 25h9M48 40h9" stroke="#4fd6e8" stroke-width="1.6" opacity=".7"/>
        <circle cx="16" cy="32" r="2.2" fill="#4fd6e8"/><circle cx="48" cy="25" r="2.2" fill="#8b7bff"/><circle cx="48" cy="40" r="2.2" fill="#5fe0a1"/>
      </svg>
      <div class="wordmark">
        <p class="eyebrow"><span class="led" aria-hidden="true"></span>Agenda Tech</p>
        <h1 id="title">Bati<span class="cursor" aria-hidden="true">_</span></h1>
        <p id="date" class="dateline"></p>
      </div>
    </div>
    <div class="card">
      <p class="cardh"><span>Esta semana</span><span id="wkRange"></span></p>
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 100 100" role="img" id="ring"></svg>
        <div class="kpis">
          <div class="a"><b id="kHoy">–</b>para hoy</div>
          <div class="c"><b id="kSoon">–</b>en 3 días</div>
          <div class="r"><b id="kLate">–</b>con retraso</div>
        </div>
      </div>
    </div>
    <div class="card">
      <p class="cardh"><span>Categorías</span><button type="button" class="cedit" id="catEdit">editar</button></p>
      <div class="cats" id="cats"></div>
    </div>
  </aside>

  <main>
    <form class="cmd" id="f">
      <div class="cmdin"><span class="prompt" aria-hidden="true">›</span>
        <textarea id="txt" name="nota" rows="2" placeholder="Apunta una tarea o una idea, o pega un link de YouTube o Instagram con unas palabras de qué va" aria-label="Nueva nota" autocomplete="off"></textarea></div>
      <div class="cmdbar">
        <select id="cat" name="categoria" aria-label="Categoría"></select>
        <button type="button" class="q" data-d="0">hoy</button>
        <button type="button" class="q" data-d="1">mañana</button>
        <button type="button" class="q" data-d="mon">lunes</button>
        <input type="date" id="fecha" name="fecha" aria-label="Fecha">
        <button class="go" id="add" type="submit">Apuntar <kbd>⌘↵</kbd></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <div class="card">
      <div class="tlh"><h2>Próximos 14 días</h2><span id="tlInfo"></span></div>
      <div class="timeline" id="timeline"></div>
    </div>

    <div>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="tareas">Tareas <span id="nT">0</span></button>
        <button class="tab" role="tab" data-tab="ideas">Ideas <span id="nI">0</span></button>
        <button class="tab" role="tab" data-tab="hechas">Hechas <span id="nH">0</span></button>
      </div>
      <div id="view" role="tabpanel"></div>
    </div>
  </main>
</div>

<script>window.CFG = Object.assign({"u": "bati", "nombre": "Bati", "cats": ["Trading", "Negocio", "Proyectos IA", "Aprender", "Salud", "Compras", "Ocio", "Personal"], "tech": true, "exec": "https://script.google.com/macros/s/AKfycbyYbn-NGAhwfC8didKOoar3qXEeZD6vQP1Dy4AvvJn4JZkspXiyx9HDLIJEubLVcL45/exec"}, { k: new URLSearchParams(location.hash.slice(1)).get("k") || "" });</script>
<script>
// Shared logic for both notebooks: talking to the server, dates and groups.
const CFG = window.CFG;
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// Talks to the server through a direct POST to the web app. If that is not possible,
// it falls back to google.script.run.
const gsr = (fn, args) => new Promise((ok, ko) => typeof google === "undefined" ? ko(new Error("No hay conexión con el servidor. Revisa internet y recarga.")) :
  google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](CFG.u, CFG.k, ...args));
async function api(fn, ...args) {
  if (CFG.exec) {
    let r;
    try { r = await fetch(CFG.exec, { method: "POST", body: JSON.stringify({ fn, u: CFG.u, k: CFG.k, args }) }).then(x => x.json()); }
    catch (e) { return gsr(fn, args); }
    if (!r.ok) throw new Error(r.error);
    return r.data;
  }
  return gsr(fn, args);
}
// Days overdue (0 if on time or done).
const retraso = it => (!it.hecho && it.fecha && it.fecha < today()) ? -daysTo(it.fecha) : 0;

const today = () => new Date().toLocaleDateString("sv");
const addDays = (d, n) => { const x = new Date(d + "T12:00"); x.setDate(x.getDate() + n); return x.toLocaleDateString("sv"); };
const daysTo = d => Math.round((new Date(d + "T12:00") - new Date(today() + "T12:00")) / 864e5);
const D = d => new Date(d + "T12:00");
const F = {
  long: new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" }),
  short: new Intl.DateTimeFormat("es-ES", { weekday: "short", day: "numeric", month: "short" }),
  wd: new Intl.DateTimeFormat("es-ES", { weekday: "short" }),
  day: new Intl.DateTimeFormat("es-ES", { day: "numeric" })
};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const plural = (n, uno, varios) => n + " " + (n === 1 ? uno : varios);
const nextWeekday = wd => { let d = today(); do { d = addDays(d, 1); } while (D(d).getDay() !== wd); return d; };

function bucket(it) {
  if (it.hecho) return "done";
  if (!it.fecha) return "nodate";
  const t = today();
  if (it.fecha < t) return "late"; if (it.fecha === t) return "today";
  if (it.fecha <= addDays(t, 7)) return "week"; return "later";
}
const byDate = (a, b) => (a.fecha || "9").localeCompare(b.fecha || "9") || String(b.creado).localeCompare(String(a.creado));

const Store = {
  items: [], loaded: false, onchange: () => {}, onerror: () => {},
  async load() {
    try { this.items = await api("listar"); this.loaded = true; this.onchange(); }
    catch (e) { this.onerror(/Enlace no válido/.test(errMsg(e)) ? "Este enlace no es válido. Abre tu enlace personal completo, tal como te llegó." : "No se pudieron cargar las tareas. Recarga la página para intentarlo de nuevo."); }
  },
  async add(texto, fecha, cat) {
    const o = await api("anadir", texto, fecha, cat);
    this.items.push(o); this.onchange(); return o;
  },
  async change(it, campos) {
    Object.assign(it, campos); this.onchange();
    try { await api("actualizar", it.id, campos); }
    catch (e) { this.onerror("No se guardó el cambio. Recarga la página."); this.load(); }
  },
  async remove(it) {
    this.items = this.items.filter(x => x !== it); this.onchange();
    try { await api("borrar", it.id); } catch (e) { this.load(); }
  },
  pending() { return this.items.filter(i => !i.hecho); }
};

// Delete in two taps, since the viewer has no confirm dialogs.
function deleteButton(cls, it, label, confirmLabel) {
  const b = el("button", cls, label); b.type = "button";
  b.onclick = () => {
    if (!b.classList.contains("confirm")) {
      b.classList.add("confirm"); b.textContent = confirmLabel;
      setTimeout(() => { b.classList.remove("confirm"); b.textContent = label; }, 3000); return;
    }
    Store.remove(it);
  };
  return b;
}

// Edit panel (a <dialog>). Each page styles the .ed-* classes in its own way.
// opts: { tipo: true to allow switching idea/task, quick: [[label, date], ...] }
function openEditor(it, opts = {}) {
  let dlg = document.getElementById("editor");
  if (!dlg) { dlg = el("dialog", "ed"); dlg.id = "editor"; document.body.append(dlg); dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); }); }
  dlg.innerHTML = "";
  const form = el("form", "ed-form"); form.method = "dialog";
  const head = el("div", "ed-head");
  const h = el("h2", "ed-title", "Editar " + (it.tipo === "idea" ? "idea" : "tarea"));
  const x = el("button", "ed-close", "✕"); x.type = "button"; x.setAttribute("aria-label", "Cerrar"); x.onclick = () => dlg.close();
  head.append(h, x);

  const field = (label, input) => { const l = el("label", "ed-field"); l.append(el("span", "ed-lbl", label), input); return l; };
  const tt = el("textarea", "ed-input"); tt.rows = 2; tt.value = it.titulo; tt.id = "ed-titulo";
  const cs = el("select", "ed-input"); cs.id = "ed-cat"; CFG.cats.forEach(c => cs.append(new Option(c, c, false, c === it.categoria)));
  const fd = el("input", "ed-input"); fd.type = "date"; fd.value = it.fecha || ""; fd.id = "ed-fecha";
  const quick = el("div", "ed-quick");
  (opts.quick || [["Hoy", today()], ["Mañana", addDays(today(), 1)], ["Sin fecha", ""]]).forEach(([l, d]) => {
    const b = el("button", "ed-chip", l); b.type = "button"; b.onclick = () => { fd.value = d; }; quick.append(b);
  });
  const fw = el("div", "ed-datewrap"); fw.append(fd, quick);
  const nt = el("textarea", "ed-input"); nt.rows = 3; nt.value = it.resumen || ""; nt.id = "ed-notas"; nt.placeholder = "Detalles, pasos, lo que necesites recordar";
  form.append(head, field("Título", tt), field("Categoría", cs), field("Fecha", fw));
  let tp = null;
  if (opts.tipo) {
    tp = el("div", "ed-seg"); tp.setAttribute("role", "radiogroup"); tp.setAttribute("aria-label", "Tipo");
    [["tarea", "Tarea"], ["idea", "Idea"]].forEach(([v, l]) => {
      const b = el("button", "ed-segbtn", l); b.type = "button"; b.dataset.v = v; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", (it.tipo || "tarea") === v);
      b.onclick = () => tp.querySelectorAll("button").forEach(o => o.setAttribute("aria-checked", o === b)); tp.append(b);
    });
    form.append(field("Tipo", tp));
  }
  form.append(field("Notas", nt));
  if (it.url) { const a = el("a", "ed-link", "Abrir enlace original ↗"); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; form.append(a); }
  if (retraso(it)) form.append(el("p", "ed-note", "Retraso: " + plural(retraso(it), "día", "días") + " desde la fecha límite (" + F.short.format(D(it.fecha)) + ")."));

  const act = el("div", "ed-actions");
  const del = deleteButton("ed-del", it, "Borrar", "Pulsa otra vez para borrar");
  const origDel = del.onclick; del.onclick = () => { const was = del.classList.contains("confirm"); origDel(); if (was) dlg.close(); };
  const done = el("button", "ed-done", it.hecho ? "Marcar pendiente" : "Marcar hecha"); done.type = "button";
  done.onclick = () => { Store.change(it, { hecho: !it.hecho }); dlg.close(); };
  const save = el("button", "ed-save", "Guardar"); save.type = "submit";
  act.append(del, done, save);
  form.append(act);
  if (opts.dup) {
    const dup = el("button", "ed-dup", "Duplicar tarea"); dup.type = "button";
    dup.onclick = async () => {
      dup.disabled = true; dup.textContent = "Duplicando…";
      try {
        const o = await Store.add((tt.value.trim() || it.titulo).slice(0, 200), fd.value, cs.value);
        const extra = {}; const nv = nt.value.trim(); if (nv) extra.resumen = nv.slice(0, 2000);
        if (it.tipo && it.tipo !== "tarea") extra.tipo = it.tipo;
        if (Object.keys(extra).length) await Store.change(o, extra);
        openEditor(o, opts);
      } catch (e) { dup.disabled = false; dup.textContent = "No se pudo duplicar: " + errMsg(e); }
    };
    form.append(dup);
  }
  form.addEventListener("submit", e => {
    e.preventDefault();
    const c = {};
    const ti = tt.value.trim(); if (ti && ti !== it.titulo) c.titulo = ti.slice(0, 200);
    if (cs.value !== it.categoria) c.categoria = cs.value;
    if (fd.value !== (it.fecha || "")) { c.fecha = fd.value; c.aplazada = 0; }
    if (nt.value.trim() !== (it.resumen || "")) c.resumen = nt.value.trim().slice(0, 2000);
    if (tp) { const v = tp.querySelector('[aria-checked="true"]').dataset.v; if (v !== (it.tipo || "tarea")) c.tipo = v; }
    if (Object.keys(c).length) Store.change(it, c);
    dlg.close();
  });
  tt.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  dlg.append(form);
  dlg.showModal();
  tt.focus(); tt.setSelectionRange(tt.value.length, tt.value.length);
}

// Category manager: create, rename and delete. The page passes onCats to redraw its controls.
const errMsg = e => String(e && e.message || e || "Error desconocido").replace(/^Error:\s*/, "").replace(/^Exception:\s*/, "");
let onCats = () => {};
async function catOp(fn, ...args) {
  const lista = await api(fn, ...args);
  CFG.cats.splice(0, CFG.cats.length, ...lista);
  onCats();
  await Store.load();
}

function openCatManager() {
  let dlg = document.getElementById("catmgr");
  if (!dlg) { dlg = el("dialog", "ed"); dlg.id = "catmgr"; document.body.append(dlg); dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); }); }
  const draw = (msg) => {
    dlg.innerHTML = "";
    const form = el("form", "ed-form"); form.method = "dialog";
    const head = el("div", "ed-head");
    const x = el("button", "ed-close", "✕"); x.type = "button"; x.setAttribute("aria-label", "Cerrar"); x.onclick = () => dlg.close();
    head.append(el("h2", "ed-title", "Categorías"), x);
    form.append(head, el("p", "ed-help", "Cambia el nombre y pulsa Guardar. Si borras una categoría, sus tareas pasan a la que elijas."));
    const ul = el("ul", "cm-list");
    CFG.cats.forEach(c => {
      const li = el("li", "cm-row");
      const n = Store.items.filter(i => i.categoria === c).length;
      const inp = el("input", "ed-input cm-name"); inp.value = c; inp.setAttribute("aria-label", "Nombre de " + c); inp.maxLength = 40;
      const count = el("span", "cm-count", plural(n, "nota", "notas"));
      const save = el("button", "cm-save", "Guardar"); save.type = "button"; save.hidden = true;
      inp.oninput = () => { save.hidden = !inp.value.trim() || inp.value.trim() === c; };
      const doRename = async () => {
        save.disabled = true;
        try { await catOp("renombrarCategoria", c, inp.value); draw("Renombrada a «" + inp.value.trim() + "»."); }
        catch (e) { draw(errMsg(e)); }
      };
      save.onclick = doRename;
      inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (!save.hidden) doRename(); } };
      const del = el("button", "cm-del", "Borrar"); del.type = "button";
      del.onclick = () => {
        if (CFG.cats.length <= 1) { draw("Necesitas al menos una categoría."); return; }
        const box = el("div", "cm-confirm");
        const others = CFG.cats.filter(o => o !== c);
        const sel = el("select", "ed-input"); others.forEach(o => sel.append(new Option(o, o))); sel.setAttribute("aria-label", "Mover las notas a");
        const ok = el("button", "cm-ok", "Borrar «" + c + "»"); ok.type = "button";
        const no = el("button", "cm-no", "Cancelar"); no.type = "button"; no.onclick = () => draw();
        ok.onclick = async () => { ok.disabled = true; try { await catOp("eliminarCategoria", c, sel.value); draw("Categoría borrada."); } catch (e) { draw(errMsg(e)); } };
        box.append(el("span", "ed-lbl", n ? "Mover sus " + plural(n, "nota", "notas") + " a:" : "No tiene notas."), n ? sel : "", el("div", "cm-btns"));
        box.lastChild.append(no, ok);
        li.append(box); del.hidden = true;
      };
      li.append(el("span", "cm-dot"), inp, count, save, del);
      li.firstChild.style.background = typeof catColorOf === "function" ? catColorOf(c) : "currentColor";
      ul.append(li);
    });
    const add = el("div", "cm-add");
    const ni = el("input", "ed-input"); ni.placeholder = "Nueva categoría"; ni.maxLength = 40; ni.setAttribute("aria-label", "Nueva categoría");
    const nb = el("button", "ed-save", "Añadir"); nb.type = "submit";
    add.append(ni, nb);
    form.append(ul, add);
    if (msg) form.append(el("p", "ed-note", msg));
    form.addEventListener("submit", async e => {
      e.preventDefault(); if (!ni.value.trim()) { ni.focus(); return; }
      nb.disabled = true;
      try { await catOp("crearCategoria", ni.value); draw("Añadida «" + ni.value.trim() + "»."); }
      catch (err) { draw(errMsg(err)); }
    });
    dlg.append(form);
  };
  draw();
  if (!dlg.open) dlg.showModal();
}

function ytId(url) { const m = String(url).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null; }

<script>
const COLORS = ["#ffb547","#8b7bff","#4fd6e8","#5fe0a1","#ff8fb1","#7aa2ff","#f4e06d","#b4bdd8"];
const cc = c => COLORS[Math.max(0, CFG.cats.indexOf(c)) % COLORS.length];
let tab = "tareas", catF = null, dayF = null, picked = null;
try { tab = localStorage.getItem("bati.tab") || "tareas"; } catch (e) {}

document.title = "Agenda Tech · " + CFG.nombre;
$("#date").textContent = cap(F.long.format(new Date()));
const sel = $("#cat");
function buildSelect() {
  const v = sel.value; sel.innerHTML = "";
  sel.append(new Option("Categoría automática", ""));
  CFG.cats.forEach(c => sel.append(new Option(c, c)));
  sel.value = CFG.cats.indexOf(v) >= 0 ? v : "";
  if (catF && CFG.cats.indexOf(catF) < 0) catF = null;
}
const catColorOf = c => cc(c);
onCats = () => { buildSelect(); render(); };
buildSelect();

function setWhen(d) { picked = d; $("#fecha").value = d || ""; document.querySelectorAll(".q").forEach(b => b.setAttribute("aria-pressed", b.dataset.val === d)); }
document.querySelectorAll(".q").forEach(b => {
  b.dataset.val = b.dataset.d === "mon" ? nextWeekday(1) : addDays(today(), +b.dataset.d);
  b.onclick = () => setWhen(picked === b.dataset.val ? null : b.dataset.val);
});
$("#fecha").onchange = e => setWhen(e.target.value || null);
$("#txt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#f").requestSubmit(); } });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#txt").focus(); } });

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("#txt").value.trim();
  if (!text) { $("#status").textContent = "Escribe algo antes de apuntarlo."; $("#txt").focus(); return; }
  $("#add").disabled = true; $("#status").textContent = "Apuntando…";
  try {
    const o = await Store.add(text, picked || "", sel.value);
    $("#txt").value = ""; setWhen(null);
    $("#status").textContent = (o.tipo === "idea" ? "Idea" : "Tarea") + " apuntada en " + o.categoria + (o.fecha ? " para el " + F.short.format(D(o.fecha)) : "") + ".";
    if (o.tipo === "idea" && tab !== "ideas") { tab = "ideas"; render(); }
  } catch (err) { $("#status").textContent = "No se pudo apuntar: " + errMsg(err); }
  $("#add").disabled = false;
});

$("#catEdit").onclick = openCatManager;
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; try { localStorage.setItem("bati.tab", tab); } catch (e) {} render(); });

Store.onerror = m => { $("#status").textContent = m; };
Store.onchange = render;

function ring(done, total) {
  const r = 40, c = 2 * Math.PI * r, p = total ? done / total : 0;
  $("#ring").setAttribute("aria-label", done + " de " + total + " tareas de esta semana hechas");
  $("#ring").innerHTML = `<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#4fd6e8"/></linearGradient></defs>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#212c4d" stroke-width="9"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .6s ease"/>
    <text x="50" y="52" text-anchor="middle" class="v">${Math.round(p * 100)}%</text><text x="50" y="66" text-anchor="middle" class="l">${done}/${total}</text>`;
}

function render() {
  const t = today(), all = Store.items, pend = Store.pending();
  // Semana de lunes a domingo
  const dow = (D(t).getDay() + 6) % 7, mon = addDays(t, -dow), sun = addDays(mon, 6);
  const wk = all.filter(i => i.tipo === "tarea" && i.fecha >= mon && i.fecha <= sun);
  ring(wk.filter(i => i.hecho).length, wk.length);
  $("#wkRange").textContent = F.day.format(D(mon)) + "–" + F.day.format(D(sun));
  $("#kHoy").textContent = pend.filter(i => i.fecha && i.fecha <= t).length;
  $("#kSoon").textContent = pend.filter(i => i.fecha && daysTo(i.fecha) >= 1 && daysTo(i.fecha) <= 3).length;
  $("#kLate").textContent = pend.filter(i => retraso(i) > 0).length;

  const cats = $("#cats"); cats.innerHTML = "";
  const maxC = Math.max(1, ...CFG.cats.map(c => pend.filter(i => i.categoria === c).length));
  CFG.cats.forEach(c => {
    const n = pend.filter(i => i.categoria === c).length;
    const b = el("button", "catrow"); b.type = "button"; b.style.setProperty("--c", cc(c)); b.setAttribute("aria-pressed", catF === c);
    b.append(el("i"), el("span", null, c), el("span", null, n));
    const bar = el("span", "bar"), em = el("em"); em.style.width = (n / maxC * 100) + "%"; bar.append(em); b.append(bar);
    b.onclick = () => { catF = catF === c ? null : c; render(); };
    cats.append(b);
  });
  if (!cats.children.length) cats.append(el("p", "kpis", "Aparecerán al apuntar tu primera nota."));

  // Línea temporal
  const tl = $("#timeline"); tl.innerHTML = "";
  let maxN = 0;
  for (let i = 0; i < 14; i++) {
    const d = addDays(t, i);
    const its = pend.filter(x => x.fecha === d || (i === 0 && x.fecha && x.fecha < t));
    maxN = Math.max(maxN, its.length);
    const b = el("button", "tl" + (i === 0 ? " today" : "") + ([0, 6].includes(D(d).getDay()) ? " wknd" : "")); b.type = "button";
    b.setAttribute("aria-pressed", dayF === d); b.setAttribute("aria-label", cap(F.long.format(D(d))) + ": " + plural(its.length, "pendiente", "pendientes"));
    b.title = cap(F.short.format(D(d)));
    const st = el("span", "stack"); its.slice(0, 7).forEach(x => { const q = el("i"); q.style.setProperty("--c", cc(x.categoria)); st.append(q); });
    b.append(el("span", "cnt", its.length || ""), st, el("span", "dn", i === 0 ? "hoy" : F.day.format(D(d))));
    b.onclick = () => { dayF = dayF === d ? null : d; if (dayF) tab = "tareas"; render(); };
    tl.append(b);
  }
  const info = $("#tlInfo"); info.innerHTML = "";
  if (dayF) { const c = el("button", "clear", "ver todo ✕"); c.type = "button"; c.onclick = () => { dayF = null; render(); }; info.append(cap(F.short.format(D(dayF))) + " · ", c); }
  else info.textContent = plural(pend.filter(x => x.fecha && daysTo(x.fecha) <= 13).length, "pendiente", "pendientes");

  const fil = i => (!catF || i.categoria === catF);
  const tareas = all.filter(i => !i.hecho && (i.tipo === "tarea" || i.fecha) && fil(i));
  const ideas = all.filter(i => !i.hecho && i.tipo === "idea" && !i.fecha && fil(i));
  const hechas = all.filter(i => i.hecho && fil(i));
  $("#nT").textContent = tareas.length; $("#nI").textContent = ideas.length; $("#nH").textContent = hechas.length;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));

  const v = $("#view"); v.innerHTML = "";
  if (!Store.loaded) { v.append(el("div", "empty", "Cargando…")); return; }
  if (tab === "ideas") return renderIdeas(v, ideas);
  if (tab === "hechas") return renderGroups(v, [["Hechas", "done", hechas.sort(byDate).reverse()]], "Aún no has marcado nada como hecho.");
  let list = tareas;
  if (dayF) list = list.filter(i => i.fecha === dayF || (dayF === t && i.fecha && i.fecha < t));
  const by = k => list.filter(i => bucket(i) === k).sort(byDate);
  renderGroups(v, dayF ? [[cap(F.long.format(D(dayF))), "", list.sort(byDate)]] :
    [["Con retraso", "late", by("late")], ["Hoy", "today", by("today")], ["Esta semana", "week", by("week")], ["Más adelante", "later", by("later")], ["Sin fecha", "nodate", by("nodate")]],
    dayF ? "Nada para este día." : "Sin tareas pendientes. Apunta una arriba o convierte una idea en tarea.");
}

function renderGroups(v, groups, emptyMsg) {
  let any = false;
  for (const [label, cls, its] of groups) {
    if (!its.length) continue; any = true;
    const g = el("div", "group " + cls), h = el("h3", null, label); h.append(el("b", null, its.length));
    const ul = el("ul", "rows"); its.forEach(it => ul.append(row(it)));
    g.append(h, ul); v.append(g);
  }
  if (!any) { const e = el("div", "empty"); e.append(el("b", null, "Todo despejado"), emptyMsg); v.append(e); }
}

const edit = it => openEditor(it, { tipo: true, quick: [["hoy", today()], ["mañana", addDays(today(), 1)], ["lunes", nextWeekday(1)], ["sin fecha", ""]] });

function srcLabel(url) { return /instagram/.test(url) ? "Instagram" : /youtu/.test(url) ? "YouTube" : url ? new URL(url).hostname.replace("www.", "") : ""; }

function row(it) {
  const li = el("li", it.hecho ? "done" : ""); li.style.setProperty("--c", cc(it.categoria));
  const chk = el("button", "chk"); chk.type = "button"; chk.setAttribute("role", "checkbox"); chk.setAttribute("aria-checked", !!it.hecho); chk.setAttribute("aria-label", "Hecha: " + it.titulo);
  chk.onclick = () => Store.change(it, { hecho: !it.hecho });
  const meta = el("div", "meta");
  const n = it.fecha ? daysTo(it.fecha) : null;
  if (retraso(it)) meta.append(el("span", "pill r", "retraso +" + retraso(it) + (retraso(it) === 1 ? " día" : " días")));
  if (!it.hecho && n !== null && n >= 1 && n <= 3) meta.append(el("span", "pill a", n === 1 ? "mañana" : "en " + n + " días"));

  const cs = el("select"); cs.setAttribute("aria-label", "Categoría"); cs.style.color = cc(it.categoria);
  CFG.cats.forEach(c => cs.append(new Option(c, c, false, c === it.categoria))); cs.onchange = () => Store.change(it, { categoria: cs.value });
  const d = el("input"); d.type = "date"; d.value = it.fecha || ""; d.setAttribute("aria-label", "Fecha"); d.onchange = () => Store.change(it, { fecha: d.value, aplazada: 0 });
  meta.append(cs, d);
  if (it.url) { const a = el("a", "lnk", srcLabel(it.url) + " ↗"); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; meta.append(a); }
  const tb = el("button", "ttl open", it.titulo); tb.type = "button"; tb.setAttribute("aria-label", "Editar: " + it.titulo); tb.onclick = () => edit(it);
  li.append(chk, tb, deleteButton("x", it, "borrar", "¿seguro?"), meta);
  return li;
}

function renderIdeas(v, ideas) {
  if (!ideas.length) { const e = el("div", "empty"); e.append(el("b", null, "Sin ideas guardadas"), "Pega arriba un reel o un vídeo de YouTube con unas palabras de qué va."); v.append(e); return; }
  const g = el("div", "ideas");
  ideas.sort(byDate).forEach(it => {
    const c = el("article", "idea");
    const yt = it.url && ytId(it.url);
    const th = el(it.url ? "a" : "div", "thumb" + (yt ? "" : it.url && /instagram/.test(it.url) ? " ig" : " txt"));
    if (it.url) { th.href = it.url; th.target = "_blank"; th.rel = "noopener"; th.setAttribute("aria-label", "Abrir en " + srcLabel(it.url)); }
    if (yt) th.style.backgroundImage = "url(https:\/\/i.ytimg.com/vi/" + yt + "/hqdefault.jpg)"; /* sin doble barra: Google quita lo que va tras ella */
    if (!it.url) th.append(el("span", "big", it.categoria.slice(0, 2)));
    th.append(el("span", "src", it.url ? srcLabel(it.url) : "Nota"));
    const b = el("div", "ib");
    const tb = el("button", "ttl open", it.titulo); tb.type = "button"; tb.onclick = () => edit(it); b.append(tb);
    if (it.resumen) b.append(el("span", "sum", it.resumen));
    const a = el("div", "ia");
    const tg = el("span", "tagc", "● " + it.categoria); tg.style.setProperty("--c", cc(it.categoria));
    const p = el("button", "promote", "Pasar a tarea para hoy"); p.type = "button";
    p.onclick = () => Store.change(it, { tipo: "tarea", fecha: today() });
    a.append(tg, p, deleteButton("x", it, "borrar", "¿seguro?"));
    b.append(a); c.append(th, b); g.append(c);
  });
  v.append(g);
}

render();
Store.load();
</script>
<script>
if (!CFG.k) { document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px;max-width:40ch">Falta la clave en el enlace. Abre tu enlace personal completo (termina en #k=...).</p>'; }
else api("config").then(c => { CFG.cats.splice(0, CFG.cats.length, ...c.cats); onCats(); Store.onchange(); }).catch(() => {});
</script>
</body>
